name: Build debug APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-android
          name: Crew v0.5.0 — single LLM gateway
          body: |
            Debug APK for Crew (v0.5.0). One provider slot only.

            Settings → LLM gateway:
            1. Endpoint (prefilled) https://freellmapi-ferose.duckdns.org/v1
            2. Paste your FreeLLM / Reeller API key
            3. Model id your gateway already exposes (default gpt-4o-mini)
            4. Tap Save gateway

            Add Grok / Claude / NVIDIA inside FreeLLM. Changing the endpoint or key in Settings does not require a new APK.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
