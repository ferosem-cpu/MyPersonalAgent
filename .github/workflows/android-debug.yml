name: Build debug APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0-android
          name: Crew v0.4.0 — Grokbot-style assistants
          body: |
            Debug APK for Crew (v0.4.0): roster of assistants, War Room group chat, one API key.

            After install:
            1. Open Crew. You get Chief of Staff, Researcher, Writer, Ops, Memory, and War Room.
            2. Gear → paste one API key (xAI / OpenAI / OpenRouter / etc.) → Save all keys
            3. Tap + to add more assistants
            4. Open War Room to have several teammates answer the same job
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
