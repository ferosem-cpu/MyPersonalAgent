name: Build debug APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.1-android
          name: Crew v0.4.1 — FreeLLM / Reeller slot
          body: |
            Debug APK for Crew (v0.4.1): same roster + a FreeLLM provider pointed at your DuckDNS router.

            After install:
            1. Open Crew. Gear → FreeLLM / Reeller API key.
            2. Base URL is prefilled as https://freellmapi-ferose.duckdns.org/v1
            3. Paste your Reeller/FreeLLM key, set a model id from the FreeLLM Models tab (default gpt-4o-mini), tap Save all keys.
            4. Chip "FreeLLM" as preferred provider, or leave Auto (FreeLLM is tried first when a key is saved).
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
