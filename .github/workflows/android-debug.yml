name: Build debug APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-android
          name: Android standalone v0.2.0
          body: |
            Debug APK for the standalone on-device agent.

            Install: download `app-debug.apk`, allow unknown sources if asked, then open the file.

            This build replaces the previous debug install (same debug key).

            After install: open Settings (gear) → paste at least one API key → Save all keys → Chat.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
