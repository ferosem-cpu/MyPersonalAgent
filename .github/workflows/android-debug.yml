name: Build debug APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-android
          name: Android standalone v0.3.0
          body: |
            Debug APK for the standalone on-device agent (v0.3.0).

            New: share/drop files into the app → Pictures/Documents/Code/Others in your chosen Google Drive folder.
            Also: add contacts, export vCard, snooze todos, due dates, boot reminder restore.

            Install: download `app-debug.apk` or the zip, allow unknown sources if asked.

            After install:
            1. Folder icon (top bar) → Choose Drive folder → menu → Drive → MyPersonalAgent
            2. Gear → paste API key → Save all keys
            3. Share any file to MyPersonalAgent from another app
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
