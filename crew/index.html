<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080a" />
  <title>Crew</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <section id="home" class="screen">
      <div class="top">
        <h1>Crew</h1>
        <div class="row">
          <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
          <button class="icon-btn" id="addBtn" title="New assistant">+</button>
        </div>
      </div>
      <div class="search">
        <span>⌕</span>
        <input id="search" placeholder="Search assistants" />
      </div>
      <div class="pills" id="pills"></div>
      <div class="list" id="list"></div>
    </section>
    <section id="chat" class="screen">
      <div class="chat-head">
        <button class="icon-btn" id="backBtn">‹</button>
        <div id="chatAv" class="avatar sm round"></div>
        <div class="who"><b id="chatTitle">Assistant</b><small id="chatJob">Job</small></div>
        <button class="icon-btn" id="moreBtn" title="Delete">⋯</button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <textarea id="composer" rows="1" placeholder="Message"></textarea>
        <button class="send" id="send">↑</button>
      </div>
    </section>
    <section id="settings" class="screen">
      <div class="setup">
        <h1>Settings</h1>
        <p>One OpenAI-compatible gateway. Every assistant uses it. Add Grok / Claude / NVIDIA inside FreeLLM — not here.</p>
        <label class="label">Endpoint</label>
        <input id="baseUrl" class="field" placeholder="https://freellmapi-ferose.duckdns.org/v1" />
        <label class="label">API key</label>
        <input id="apiKey" class="field" type="password" autocomplete="off" placeholder="FreeLLM / Reeller key" />
        <label class="label">Model</label>
        <input id="model" class="field" placeholder="gpt-4o-mini" />
        <p class="hint">The key stays on this device except when calling the endpoint you saved. Changing the endpoint does not need a rebuild.</p>
        <div class="actions">
          <button class="ghost" id="backSettings">Back</button>
          <button class="primary" id="saveSettings">Save</button>
        </div>
      </div>
    </section>
  </div>
  <div class="sheet" id="sheet">
    <div class="panel">
      <h2>New assistant</h2>
      <label class="label">Name</label>
      <input id="botName" class="field" placeholder="Chief of Staff" />
      <label class="label">Job</label>
      <input id="botJob" class="field" placeholder="Routes work and keeps status" />
      <label class="label">Standing instructions</label>
      <textarea id="botInstr" class="field" rows="4" placeholder="How this teammate should behave"></textarea>
      <label class="label">Color</label>
      <div class="colors" id="colors"></div>
      <label class="label">Shape</label>
      <div class="shapes" id="shapes"></div>
      <div class="actions">
        <button class="ghost" id="cancelBot">Cancel</button>
        <button class="primary" id="saveBot">Add</button>
      </div>
    </div>
  </div>
  <script src="./app.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");</script>
</body>
</html>
