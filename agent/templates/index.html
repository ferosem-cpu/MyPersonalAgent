<!DOCTYPE html>
<html lang="en">
<head>
    <title>MyPersonalAgent</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="app-header">
            <div>
                <h1>🤖 MyPersonalAgent</h1>
                <p>Multi-provider AI assistant with tool access</p>
            </div>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☾ Dark</button>
        </div>
        <div class="main">
            <div class="sidebar">
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="switchTab('agent', this)">Agent</button>
                    <button class="tab-btn" onclick="switchTab('keys', this)">API Keys</button>
                </div>

                <div id="agent-tab" class="tab-content active">
                    <div class="section">
                        <h3>Provider</h3>
                        <select id="providerSelect" onchange="onProviderChange()">
                            <option value="">Select Provider...</option>
                        </select>
                        <div id="availableProviders"></div>
                    </div>
                    <div class="section">
                        <h3>Model</h3>
                        <select id="modelSelect" onchange="onModelChange()"></select>
                    </div>
                    <button onclick="initializeAgent()" id="initBtn">Initialize Agent</button>
                    <div class="status" id="status">Not initialized</div>
                </div>

                <div id="keys-tab" class="tab-content">
                    <div class="section">
                        <h3>Providers & API Keys</h3>
                        <div id="providerEditor"></div>
                        <button onclick="addProviderRow()" style="width: 100%; margin-top: 10px;">Add Provider</button>
                        <button onclick="saveApiKeys()" style="width: 100%; margin-top: 10px;">Save Providers</button>
                        <div class="save-status" id="saveStatus"></div>
                    </div>
                </div>
            </div>
            <div class="chat-container">
                <div class="messages" id="messages">
                    <div class="message assistant">
                        <div class="message-content">
                            👋 Welcome! Select a provider and model, then click "Initialize Agent" to get started.
                        </div>
                    </div>
                </div>
                <div class="input-area">
                    <div class="input-wrap">
                        <input type="text" id="input" placeholder="Type your command..." onkeypress="onKeyPress(event)" disabled>
                        <button type="button" class="mic-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice input" disabled>
                            <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="20" cy="20" r="20" fill="#4A90E2"/>
                                <path d="M20 11C18.34 11 17 12.34 17 14V20C17 21.66 18.34 23 20 23C21.66 23 23 21.66 23 20V14C23 12.34 21.66 11 20 11Z" fill="white"/>
                                <path d="M26 20C26 23.31 23.31 26 20 26C16.69 26 14 23.31 14 20H12C12 24.08 15.05 27.44 19 27.93V31H21V27.93C24.95 27.44 28 24.08 28 20H26Z" fill="white"/>
                            </svg>
                        </button>
                    </div>
                    <button class="send-btn" onclick="sendMessage()" id="sendBtn" disabled title="Send">
                        <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="20" cy="20" r="20" fill="#2ECC71"/>
                            <path d="M12 20L28 12L22 20L28 28L12 20Z" fill="white"/>
                            <path d="M12 20L22 20" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.__PROVIDERS__ = {{ providers_json|safe }};
        window.__MODELS__ = {{ models_json|safe }};
    </script>
    <!-- Markdown rendering for assistant replies (Task 4.1) - sanitized before insertion. -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
